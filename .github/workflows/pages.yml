name: Deploy to GitHub Pages

on:
  push:
    # The github-pages environment only accepts the repo's default branch.
    # Switch this to main if main becomes the default branch.
    branches: [claude/bugame-perth-bug-game-gbetu5]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html style.css sw.js manifest.webmanifest js icons _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
